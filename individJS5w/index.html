<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to JavaScript</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Task 6</h1>
    <p id="counter">0</p>
    <button id="increase">increase</button>
    <button id="decrease">Decrease</button>
    <button id="reset">Reset</button>

    <h1>Task 7</h1>
    <label for="textInput">Enter your text:</label>
    <input type="text" id="textInput">
    <p id="preview">Your text will appear here</p>
    <p>Characters: <span id="charCount">0</span></p>
    <button id="clear">Clear</button>

    <h1>Task 8</h1>
    <label for="mac">Which Mac fits your budget?</label>
    <select id="mac">
        <option value="macbook">MacBook</option>
        <option value="macpro">Mac Pro</option>
        <option value="bun">Poppy Seed Bun</option>
    </select>
    <p>
        <img id="macImage" src="images/macbook.jpg" alt="Apple MacBook laptop" width="250">
    </p>
    <p id="caption">You can afford a MacBook!</p>

    <h1>Task 9</h1>
    <label for="keyboardInput">Type smth:</label>
    <input type="text" id="keyboardInput">
    <p id="keyStatus">Press any key</p>
    <p id="keyResult"></p>


    <h1>Task 10</h1>
    <p id="instruction">Hover over the card.</p>
    <div id="card" tabindex="0">I AM A CARD.</div>
</body>
</html>
